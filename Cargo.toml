[workspace]
members = ["crates/core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/messenger-nexus"

[workspace.dependencies]
rkyv = { version = "0.8.18", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
flow = { package = "flow-ethos", git = "https://github.com/LiGoldragon/flow", rev = "5c61d66648a17a218147f3ec11dd995847c8303d", default-features = false }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", default-features = false }
